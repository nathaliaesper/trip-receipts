<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMI - Trip Receipts</title>
<meta name="theme-color" content="#17479E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --ink:#16223C;
    --paper:#F4F6FA;
    --card:#FFFFFF;
    --accent:#17479E;
    --accent-soft:#E5EDF9;
    --muted:#66718A;
    --line:#D5DBE7;
    --danger:#A33B2E;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);background:var(--paper);color:var(--ink);
    min-height:100vh;padding-bottom:110px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px}

  header{
    background:var(--accent);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 0 14px;
    margin-bottom:16px;
  }
  header .wrap{display:flex;align-items:baseline;justify-content:space-between}
  header h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em}
  header .total{font-family:var(--mono);font-size:1.05rem}
  header .total small{font-size:.7rem;opacity:.8;font-family:var(--sans);margin-right:6px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:16px;
  }
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}

  label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select{
    width:100%;min-width:0;padding:11px 12px;font-size:1rem;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .amt{font-family:var(--mono)}
  .ver{text-align:center;font-size:.7rem;color:var(--muted);font-family:var(--mono);margin:4px 0 8px}
  .row{display:flex;gap:10px}
  .row>div{flex:1;min-width:0}
  .row-date{flex:0 0 44% !important}
  select{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
  input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:44px}
  .rate-row{display:flex;gap:6px}
  .rate-row input{flex:1;min-width:0}
  .rate-btn{
    flex:0 0 44px;border:1px solid var(--accent);border-radius:8px;
    background:var(--accent-soft);color:var(--accent);font-size:1.1rem;cursor:pointer;
  }
  .rate-btn:active{background:var(--accent);color:#fff}

  .photo-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px;margin-top:12px;
    border:1.5px dashed var(--accent);border-radius:10px;
    background:var(--accent-soft);color:var(--accent);
    font-size:.95rem;font-weight:600;cursor:pointer;
  }
  .photo-btn img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .attach-link{
    display:block;width:100%;margin-top:8px;padding:8px;background:none;border:none;
    color:var(--accent);font-size:.85rem;cursor:pointer;text-align:center;
  }

  .clear-all-btn{
  background:none;border:none;color:var(--danger);
  font-size:.75rem;font-weight:600;cursor:pointer;padding:4px;
  }
  .clear-all-btn:disabled{opacity:.35;cursor:default}

  .actions{display:flex;gap:10px;margin-top:16px}
  button.primary{
    flex:1;padding:14px;font-size:1rem;font-weight:700;border:none;border-radius:10px;
    background:var(--accent);color:#fff;cursor:pointer;
  }
  button.ghost{
    padding:14px 16px;font-size:.95rem;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--muted);cursor:pointer;
  }

  /* receipt-tape list */
  .tape{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .tape-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line)}
  .tape-head h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .tape-head span{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
  .entry{
    display:flex;gap:12px;align-items:center;padding:12px 16px;
    border-bottom:1px dashed var(--line);
  }
  .entry:last-child{border-bottom:none}
  .entry .thumb{
    width:46px;height:46px;border-radius:6px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--line);background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.65rem;
  }
  .entry .info{flex:1;min-width:0}
  .entry .info .type{font-weight:600;font-size:.95rem}
  .entry .info .date{font-size:.75rem;color:var(--muted);font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .amounts{text-align:right;font-family:var(--mono)}
  .entry .amounts .usd{font-weight:700;font-size:.95rem}
  .entry .amounts .local{font-size:.75rem;color:var(--muted)}
  .entry .del{
    background:none;border:none;color:var(--danger);font-size:1.1rem;
    padding:8px 4px 8px 8px;cursor:pointer;flex-shrink:0;
  }
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}

  /* export bar */
  .export-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--line);
    padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .export-bar .wrap{display:flex;gap:10px;padding:0}
  .export-bar button{
    flex:1;padding:13px;font-size:.9rem;font-weight:700;border-radius:10px;cursor:pointer;
    border:1.5px solid var(--accent);background:#fff;color:var(--accent);
  }
  .export-bar button:disabled{opacity:.4;cursor:default}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;
  }
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}

  /* crop modal */
  .crop-modal{
    position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.92);
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .crop-modal[hidden]{display:none}
  .crop-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  .crop-wrap{position:relative}
  .crop-wrap img{display:block;max-width:calc(100vw - 24px);max-height:calc(100vh - 140px);user-select:none;-webkit-user-select:none}
  .crop-rect{
    position:absolute;border:2px solid #fff;
    box-shadow:0 0 0 9999px rgba(10,16,30,.55);cursor:move;touch-action:none;
  }
  .crop-h{
    position:absolute;width:34px;height:34px;touch-action:none;
  }
  .crop-h::after{
    content:"";position:absolute;width:16px;height:16px;background:#fff;
    border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .crop-h[data-h=nw]{top:-17px;left:-17px;cursor:nwse-resize}
  .crop-h[data-h=ne]{top:-17px;right:-17px;cursor:nesw-resize}
  .crop-h[data-h=sw]{bottom:-17px;left:-17px;cursor:nesw-resize}
  .crop-h[data-h=se]{bottom:-17px;right:-17px;cursor:nwse-resize}
  .crop-actions{display:flex;gap:8px;padding-top:12px}
  .crop-actions button{
    flex:1;padding:13px 6px;font-size:.9rem;font-weight:700;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;
  }
  .crop-actions #cropOk{background:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>CMI - Trip Receipts</h1>
    <div class="total"><small>TOTAL</small>$<span id="totalUsd">0.00</span></div>
  </div>
</header>

<div class="wrap">

  <section class="card" aria-label="Add expense">
    <h2 id="formTitle">New expense</h2>

    <div class="row">
      <div class="row-date">
        <label for="fDate">Date</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label for="fType">Expense type</label>
        <select id="fType">
          <option>Meals</option>
          <option>Transportation</option>
          <option>Lodging</option>
          <option>Conference / Fees</option>
          <option>Copy / Printer</option>
          <option>Supplies</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <label for="fDesc">Expense</label>
    <input type="text" id="fDesc" placeholder="e.g. Taxi from airport to hotel" maxlength="120">

    <div class="row">
      <div style="flex:0 0 34%">
        <label for="fCur">Currency</label>
        <select id="fCur">
          <option>EUR</option><option>BRL</option><option>USD</option><option>GBP</option>
          <option>CAD</option><option>JPY</option><option>CHF</option><option>MXN</option>
        </select>
      </div>
      <div>
        <label for="fLocal">Amount (local)</label>
        <input type="text" class="amt" id="fLocal" inputmode="decimal" placeholder="0.00">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="fRate">Rate (1 local = ? USD)</label>
        <div class="rate-row">
          <input type="text" class="amt" id="fRate" inputmode="decimal" placeholder="e.g. 1.08">
          <button type="button" id="rateBtn" class="rate-btn" aria-label="Fetch today's rate" title="Fetch today's rate">&#8635;</button>
        </div>
      </div>
      <div>
        <label for="fUsd">Amount (USD)</label>
        <input type="text" class="amt" id="fUsd" inputmode="decimal" placeholder="0.00">
      </div>
    </div>

    <button type="button" class="photo-btn" id="photoBtn">
      <span id="photoLabel">&#128247; Snap receipt photo</span>
    </button>
    <input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
    <button type="button" class="attach-link" id="fileBtn">&#128206; …or attach an image / PDF file</button>
    <input type="file" id="fFile" accept="image/*,application/pdf" hidden>

    <div class="actions">
      <button type="button" class="primary" id="saveBtn">Save expense</button>
      <button type="button" class="ghost" id="cancelBtn" hidden>Cancel</button>
    </div>
  </section>

  <section class="tape" aria-label="Expense list">
    <div class="tape-head">
    <h2>Logged</h2>
    <div style="display:flex;align-items:center;gap:10px">
    <span id="countLabel">0 entries</span>
    <button type="button" id="clearAllBtn" class="clear-all-btn">Clear all</button>
    </div>
    </div>
    <div id="list"><div class="empty">Nothing logged yet. Snap your first receipt above.</div></div>
  </section>

  <p class="ver">v10</p>

</div>

<div class="export-bar">
  <div class="wrap">
    <button id="xlsxBtn" disabled>&#11015; Spreadsheet (.xlsx)</button>
    <button id="pdfBtn" disabled>&#11015; Receipts PDF</button>
  </div>
</div>

<div class="crop-modal" id="cropModal" hidden>
  <div class="crop-stage" id="cropStage">
    <div class="crop-wrap" id="cropWrap">
      <img id="cropImg" alt="Receipt to crop" draggable="false">
      <div class="crop-rect" id="cropRect">
        <div class="crop-h" data-h="nw"></div>
        <div class="crop-h" data-h="ne"></div>
        <div class="crop-h" data-h="sw"></div>
        <div class="crop-h" data-h="se"></div>
      </div>
    </div>
  </div>
  <div class="crop-actions">
    <button type="button" id="cropCancel">Cancel</button>
    <button type="button" id="cropFull">Use full photo</button>
    <button type="button" id="cropOk">Crop &#10003;</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- IndexedDB ---------- */
const DB_NAME = "trip-receipts", DB_VER = 1;
let db;
function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains("expenses"))
        d.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains("settings"))
        d.createObjectStore("settings", { keyPath: "key" });
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error || new Error("IndexedDB transaction failed"));
    t.onabort = () => rej(t.error || new Error("IndexedDB transaction aborted"));
  });
}
/* iOS kills the IndexedDB connection when a PWA is backgrounded; every
   operation then fails until the DB is reopened. All access goes through
   these wrappers: try once, on failure reopen the DB and retry once. */
async function reopenDB(){
  try { if (db) db.close(); } catch (e) {}
  db = await openDB();
}
async function safeTx(store, mode, fn){
  try { return await tx(store, mode, fn); }
  catch (e) { await reopenDB(); return await tx(store, mode, fn); }
}
function reqPromise(makeReq){
  return new Promise((res, rej) => {
    const rq = makeReq();
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error || new Error("IndexedDB request failed"));
  });
}
async function safeReq(makeReq){
  try { return await reqPromise(makeReq); }
  catch (e) { await reopenDB(); return await reqPromise(makeReq); }
}
const getAll = () => safeReq(() => db.transaction("expenses").objectStore("expenses").getAll());
const getEntry = id => safeReq(() => db.transaction("expenses").objectStore("expenses").get(id));
const getSetting = key =>
  safeReq(() => db.transaction("settings").objectStore("settings").get(key))
    .then(r => r ? r.value : null).catch(() => null);
const putSetting = (key, value) => safeTx("settings", "readwrite", s => s.put({ key, value }));

/* ---------- state ---------- */
let editingId = null;
let pendingPhoto = null;   // Blob (compressed) for the entry being edited/created
let photoCleared = false;

const $ = id => document.getElementById(id);
const fDate=$("fDate"), fType=$("fType"), fDesc=$("fDesc"), fCur=$("fCur"),
      fLocal=$("fLocal"), fRate=$("fRate"), fUsd=$("fUsd"), fPhoto=$("fPhoto"), fFile=$("fFile");

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("show"), 2200);
}
const fmt = n => (Math.round(n * 100) / 100).toFixed(2);
// Accepts "45.50", "45,50", and "1.234,56" (pt-BR thousands + comma decimal)
function parseAmount(v){
  v = String(v == null ? "" : v).trim();
  if (!v) return NaN;
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  return parseFloat(v);
}
function describeErr(e){
  if (!e) return "unknown error";
  const name = e.name && e.name !== "Error" ? e.name : "";
  const msg = e.message || "";
  return (name && msg) ? `${name}: ${msg}` : (name || msg || String(e) || "unknown error");
}
// Surface silent phone-side errors as toasts (no console on mobile)
window.addEventListener("error", ev => toast("Error: " + (ev.message || "script error")));
window.addEventListener("unhandledrejection", ev => toast("Error: " + describeErr(ev.reason)));

/* ---------- photo capture + compression ---------- */
$("photoBtn").addEventListener("click", () => fPhoto.click());
$("fileBtn").addEventListener("click", () => fFile.click());
fPhoto.addEventListener("change", () => handleAttachment(fPhoto));
fFile.addEventListener("change", () => handleAttachment(fFile));
async function handleAttachment(input){
  const file = input.files[0];
  if (!file) return;
  try {
    if (file.type === "application/pdf") {
      if (file.size > 15 * 1024 * 1024) { toast("PDF too large (max 15 MB)"); input.value = ""; return; }
      pendingPhoto = file;
      toast("PDF attached");
    } else {
      const compressed = await compressImage(file, 1500, 0.82);
      const chosen = await openCropper(compressed);
      if (!chosen) { input.value = ""; return; }
      pendingPhoto = chosen;
      toast("Photo attached");
    }
    photoCleared = false;
    showPhotoPreview(pendingPhoto);
  } catch (e) { toast("Could not read file"); }
  input.value = "";
}
function compressImage(file, maxDim, quality){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("blob failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img load failed")); };
    img.src = url;
  });
}
function showPhotoPreview(blob){
  const label = $("photoLabel");
  label.innerHTML = "";
  if (blob && blob.type === "application/pdf") {
    label.appendChild(document.createTextNode("\u{1F4C4} PDF attached — tap to replace"));
  } else if (blob) {
    const im = document.createElement("img");
    im.src = URL.createObjectURL(blob);
    im.alt = "Receipt preview";
    label.appendChild(im);
    label.appendChild(document.createTextNode(" Retake photo"));
  } else {
    label.innerHTML = "&#128247; Snap receipt photo";
  }
}

/* ---------- cropper ---------- */
const cropModal=$("cropModal"), cropImg=$("cropImg"), cropRect=$("cropRect");
let crop = null; // {url, natW, natH, dispW, dispH, L, T, R, B, resolve, blob}

function cropDraw(){
  cropRect.style.left = crop.L + "px";
  cropRect.style.top = crop.T + "px";
  cropRect.style.width = (crop.R - crop.L) + "px";
  cropRect.style.height = (crop.B - crop.T) + "px";
}
function openCropper(blob){
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    crop = { url, blob, resolve, natW:0, natH:0, dispW:0, dispH:0, L:0, T:0, R:0, B:0 };
    cropImg.onload = () => {
      crop.natW = cropImg.naturalWidth; crop.natH = cropImg.naturalHeight;
      const r = cropImg.getBoundingClientRect();
      crop.dispW = r.width; crop.dispH = r.height;
      crop.L = r.width * 0.05; crop.T = r.height * 0.05;
      crop.R = r.width * 0.95; crop.B = r.height * 0.95;
      cropDraw();
    };
    cropModal.hidden = false;
    cropImg.src = url;
  });
}
function closeCropper(result){
  cropModal.hidden = true;
  cropImg.src = "";
  URL.revokeObjectURL(crop.url);
  const resolve = crop.resolve;
  crop = null;
  resolve(result);
}
$("cropCancel").addEventListener("click", () => closeCropper(null));
$("cropFull").addEventListener("click", () => closeCropper(crop.blob));
$("cropOk").addEventListener("click", () => {
  const sx = crop.natW / crop.dispW, sy = crop.natH / crop.dispH;
  const x = crop.L * sx, y = crop.T * sy,
        w = (crop.R - crop.L) * sx, h = (crop.B - crop.T) * sy;
  const c = document.createElement("canvas");
  c.width = Math.round(w); c.height = Math.round(h);
  const img = new Image();
  img.onload = () => {
    c.getContext("2d").drawImage(img, x, y, w, h, 0, 0, c.width, c.height);
    c.toBlob(b => closeCropper(b || crop.blob), "image/jpeg", 0.85);
  };
  img.src = crop.url;
});

// drag to move, corner handles to resize
const MIN = 40;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let drag = null; // {mode, startX, startY, L, T, R, B}
function cropPointerDown(e){
  if (!crop) return;
  const h = e.target.dataset && e.target.dataset.h;
  drag = { mode: h || "move", startX: e.clientX, startY: e.clientY,
           L: crop.L, T: crop.T, R: crop.R, B: crop.B };
  e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function cropPointerMove(e){
  if (!drag || !crop) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (drag.mode === "move") {
    const w = drag.R - drag.L, hgt = drag.B - drag.T;
    crop.L = clamp(drag.L + dx, 0, crop.dispW - w);
    crop.T = clamp(drag.T + dy, 0, crop.dispH - hgt);
    crop.R = crop.L + w; crop.B = crop.T + hgt;
  } else {
    if (drag.mode.includes("w")) crop.L = clamp(drag.L + dx, 0, drag.R - MIN);
    if (drag.mode.includes("e")) crop.R = clamp(drag.R + dx, drag.L + MIN, crop.dispW);
    if (drag.mode.includes("n")) crop.T = clamp(drag.T + dy, 0, drag.B - MIN);
    if (drag.mode.includes("s")) crop.B = clamp(drag.B + dy, drag.T + MIN, crop.dispH);
  }
  cropDraw();
}
cropRect.addEventListener("pointerdown", cropPointerDown);
cropRect.addEventListener("pointermove", cropPointerMove);
cropRect.addEventListener("pointerup", () => { drag = null; });
cropRect.addEventListener("pointercancel", () => { drag = null; });

/* ---------- rate helpers ---------- */
async function loadRateFor(cur){
  const rates = (await getSetting("rates")) || {};
  if (rates[cur] != null) fRate.value = rates[cur];
  else if (cur === "USD") fRate.value = 1;
  recompute();
}
async function fetchRate(cur, quiet){
  if (cur === "USD") { fRate.value = 1; recompute(); return true; }
  const today = new Date().toISOString().slice(0, 10);
  const d = fDate.value && fDate.value < today ? fDate.value : "latest";
  try {
    const r = await fetch(`https://api.frankfurter.dev/v1/${d}?base=${cur}&symbols=USD`);
    if (!r.ok) throw new Error();
    const j = await r.json();
    const rate = j.rates && j.rates.USD;
    if (!rate) throw new Error();
    fRate.value = rate;
    recompute();
    if (d === "latest") { // only persist today's rate as the fallback
      const rates = (await getSetting("rates")) || {};
      rates[cur] = rate;
      await putSetting("rates", rates);
    }
    if (!quiet) toast(`Rate on ${j.date}: 1 ${cur} = ${rate} USD`);
    return true;
  } catch (e) {
    if (!quiet) toast(fRate.value ? "Offline — using last saved rate" : "Offline — enter rate manually");
    return false;
  }
}
$("rateBtn").addEventListener("click", () => fetchRate(fCur.value, false));
fCur.addEventListener("change", async () => {
  await loadRateFor(fCur.value);   // saved rate first, as fallback
  fetchRate(fCur.value, true);     // then try to refresh silently
});
fDate.addEventListener("change", () => fetchRate(fCur.value, false));
function recompute(){
  const local = parseAmount(fLocal.value), rate = parseAmount(fRate.value);
  if (!isNaN(local) && !isNaN(rate)) fUsd.value = fmt(local * rate);
}
fLocal.addEventListener("input", recompute);
fRate.addEventListener("input", recompute);

/* ---------- save / edit / delete ---------- */
$("saveBtn").addEventListener("click", async () => {
  const local = parseAmount(fLocal.value), usd = parseAmount(fUsd.value);
  if (!fDate.value) return toast("Pick a date");
  if (isNaN(local)) return toast("Enter the local amount");

  const rate = parseAmount(fRate.value);
  if (!isNaN(rate)) {
    const rates = (await getSetting("rates")) || {};
    rates[fCur.value] = rate;
    await putSetting("rates", rates);
  }

  const entry = {
    date: fDate.value, type: fType.value, desc: fDesc.value.trim(), currency: fCur.value,
    local: Math.round(local * 100) / 100,
    usd: isNaN(usd) ? null : Math.round(usd * 100) / 100,
  };

  try {
    if (editingId != null) {
      const old = await getEntry(editingId);
      entry.id = editingId;
      entry.photo = photoCleared ? null : (pendingPhoto || (old && old.photo) || null);
      await safeTx("expenses", "readwrite", s => s.put(entry));
      toast("Expense updated");
    } else {
      entry.photo = pendingPhoto || null;
      await safeTx("expenses", "readwrite", s => s.add(entry));
      toast("Expense saved");
    }
    resetForm();
    render();
  } catch (err) {
    toast("Could not save: " + describeErr(err));
  }
});

$("cancelBtn").addEventListener("click", resetForm);

function resetForm(){
  editingId = null; pendingPhoto = null; photoCleared = false;
  fLocal.value = ""; fUsd.value = ""; fDesc.value = "";
  fDate.value = new Date().toISOString().slice(0, 10);
  showPhotoPreview(null);
  $("formTitle").textContent = "New expense";
  $("saveBtn").textContent = "Save expense";
  $("cancelBtn").hidden = true;
}

async function startEdit(e){
  editingId = e.id; pendingPhoto = null; photoCleared = false;
  fDate.value = e.date; fType.value = e.type; fDesc.value = e.desc || ""; fCur.value = e.currency;
  fLocal.value = e.local; fUsd.value = e.usd == null ? "" : e.usd;
  await loadRateFor(e.currency);
  fUsd.value = e.usd == null ? "" : e.usd; // keep stored value over recompute
  showPhotoPreview(e.photo || null);
  $("formTitle").textContent = "Edit expense";
  $("saveBtn").textContent = "Update expense";
  $("cancelBtn").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function remove(id){
  if (!confirm("Delete this expense?")) return;
  await safeTx("expenses", "readwrite", s => s.delete(id));
  if (editingId === id) resetForm();
  render();
}

async function clearAll(){
const items = await getAll();
if (!items.length) return;
if (!confirm(`Delete all ${items.length} expense${items.length === 1 ? "" : "s"}? This cannot be undone.`)) return;
await safeTx("expenses", "readwrite", s => s.clear());
if (editingId != null) resetForm();
render();
}
$("clearAllBtn").addEventListener("click", clearAll);

/* ---------- render ---------- */
async function render(){
  const items = (await getAll()).sort((a, b) =>
    a.date === b.date ? b.id - a.id : (a.date < b.date ? 1 : -1));
  const list = $("list");
  list.innerHTML = "";
  let total = 0, pending = 0;

  if (!items.length) {
    list.innerHTML = '<div class="empty">Nothing logged yet. Snap your first receipt above.</div>';
  }
  for (const e of items) {
    if (e.usd == null) pending++; else total += e.usd;
    const row = document.createElement("div");
    row.className = "entry";

    let thumb;
    if (e.photo && e.photo.type === "application/pdf") {
      thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.textContent = "PDF";
    } else if (e.photo) {
      thumb = document.createElement("img");
      thumb.className = "thumb";
      thumb.src = URL.createObjectURL(e.photo);
      thumb.alt = "Receipt";
    } else {
      thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.textContent = "no pic";
    }

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<div class="type"></div><div class="date"></div>`;
    info.querySelector(".type").textContent = e.type;
    info.querySelector(".date").textContent = e.desc ? `${e.date} · ${e.desc}` : e.date;

    const amounts = document.createElement("div");
    amounts.className = "amounts";
    amounts.innerHTML = `<div class="usd"></div><div class="local"></div>`;
    amounts.querySelector(".usd").textContent = e.usd == null ? "$ —" : "$" + fmt(e.usd);
    amounts.querySelector(".local").textContent = fmt(e.local) + " " + e.currency;

    const del = document.createElement("button");
    del.className = "del"; del.innerHTML = "&#10005;";
    del.setAttribute("aria-label", "Delete expense");
    del.addEventListener("click", ev => { ev.stopPropagation(); remove(e.id); });

    row.append(thumb, info, amounts, del);
    row.addEventListener("click", () => startEdit(e));
    list.appendChild(row);
  }
  $("totalUsd").textContent = fmt(total);
  $("countLabel").textContent = items.length + (items.length === 1 ? " entry" : " entries")
    + (pending ? ` · ${pending} pending USD` : "");
  $("xlsxBtn").disabled = !items.length;
  $("clearAllBtn").disabled = !items.length;
  $("pdfBtn").disabled = !items.some(e => e.photo);
}

/* ---------- exports ---------- */
const stamp = () => new Date().toISOString().slice(0, 10);

$("xlsxBtn").addEventListener("click", async () => {
  const items = (await getAll()).sort((a, b) => a.date < b.date ? -1 : 1);
  const rows = [["Date", "Expense Type", "Expense", "Amount (Local Currency)", "Currency", "Amount (USD)"]];
  let total = 0;
  for (const e of items) {
    rows.push([e.date, e.type, e.desc || "", e.local, e.currency, e.usd == null ? "" : e.usd]);
    if (e.usd != null) total += e.usd;
  }
  rows.push([]);
  rows.push(["", "", "TOTAL", "", "", Math.round(total * 100) / 100]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 12 }, { wch: 18 }, { wch: 34 }, { wch: 20 }, { wch: 9 }, { wch: 13 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Expenses");
  XLSX.writeFile(wb, `expenses_${stamp()}.xlsx`);
  toast("Spreadsheet exported");
});

$("pdfBtn").addEventListener("click", async () => {
  toast("Building PDF…");
  try {
    const items = (await getAll()).filter(e => e.photo)
      .sort((a, b) => a.date < b.date ? -1 : 1);
    const { PDFDocument, StandardFonts } = PDFLib;
    const doc = await PDFDocument.create();
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const fontB = await doc.embedFont(StandardFonts.HelveticaBold);
    const A4W = 595.28, A4H = 841.89, M = 42;

    const wrap = (text, f, size, maxW) => {
      const words = String(text).split(/\s+/), lines = [];
      let line = "";
      for (const w of words) {
        const t = line ? line + " " + w : w;
        if (f.widthOfTextAtSize(t, size) > maxW && line) { lines.push(line); line = w; }
        else line = t;
      }
      if (line) lines.push(line);
      return lines;
    };

    // Draws the caption, returns the y of the top of the free area below it
    const drawCaption = (page, e) => {
      let y = A4H - M;
      page.drawText(`Date: ${e.date}`, { x: M, y: y - 11, size: 11, font: fontB });
      y -= 11 + 6;
      for (const line of wrap(`Expense: ${e.desc || e.type}`, font, 10, A4W - 2 * M)) {
        page.drawText(line, { x: M, y: y - 10, size: 10, font });
        y -= 10 + 4;
      }
      page.drawText(`Amount (USD): ${e.usd == null ? "\u2014" : "$" + fmt(e.usd)}`,
        { x: M, y: y - 10, size: 10, font });
      return y - 10 - 10;
    };

    for (const e of items) {
      const bytes = await e.photo.arrayBuffer();
      if (e.photo.type === "application/pdf") {
        const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
        const embedded = await doc.embedPdf(src, src.getPageIndices());
        embedded.forEach((ep, i) => {
          const page = doc.addPage([A4W, A4H]);
          const top = i === 0 ? drawCaption(page, e) : A4H - M;
          const s = Math.min((A4W - 2 * M) / ep.width, (top - M) / ep.height, 1);
          page.drawPage(ep, {
            x: M, y: top - ep.height * s,
            xScale: s, yScale: s,
          });
        });
      } else {
        const img = await doc.embedJpg(bytes);
        const page = doc.addPage([A4W, A4H]);
        const top = drawCaption(page, e);
        const s = Math.min((A4W - 2 * M) / img.width, (top - M) / img.height);
        page.drawImage(img, {
          x: M, y: top - img.height * s,
          width: img.width * s, height: img.height * s,
        });
      }
    }

    const out = await doc.save();
    const blob = new Blob([out], { type: "application/pdf" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `receipts_${stamp()}.pdf`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("PDF exported");
  } catch (err) {
    toast("PDF export failed: " + (err && err.message ? err.message : "unknown error"));
  }
});

/* ---------- init ---------- */
(async function init(){
  db = await openDB();
  fDate.value = new Date().toISOString().slice(0, 10);
  await loadRateFor(fCur.value);
  fetchRate(fCur.value, true);
  render();
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }
})();
</script>
